services:
  main-service:
    build: ./ewm-main-service
    image: ewm-main-service
    container_name: ewm-main-service
    ports:
      - "8080:8080"
    depends_on:
      main-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    environment:
      MAIN_DB_URL: jdbc:postgresql://main-db:5432/ewm_main
      MAIN_DB_USER: main
      MAIN_DB_PASSWORD: main
      STATS_SERVER_URL: http://stats-server:9090

  main-db:
    image: postgres:16.1
    container_name: ewm-main-db
    environment:
      POSTGRES_DB: ewm_main
      POSTGRES_USER: main
      POSTGRES_PASSWORD: main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U main -d ewm_main"]
      interval: 5s
      timeout: 5s
      retries: 10

  stats-server:
    build: ./stats/stats-server
    image: ewm-stats-server
    container_name: ewm-stats-server
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      STATS_DB_URL: jdbc:postgresql://stats-db:5432/ewm_stats
      STATS_DB_USER: stats
      STATS_DB_PASSWORD: stats

  stats-db:
    image: postgres:16.1
    container_name: ewm-stats-db
    environment:
      POSTGRES_DB: ewm_stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats -d ewm_stats"]
      interval: 5s
      timeout: 5s
      retries: 10
